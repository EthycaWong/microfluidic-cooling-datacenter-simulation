<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1100" height="640" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <text x="30" y="38" font-size="22" font-weight="bold" fill="#111827">Closed-loop cooling plant: equipment loop → CDU → facility loop → dry cooler</text>
  <text x="30" y="62" fill="#4b5563">Two sealed loops, fluids never mix. Heat leaves to outdoor air through a dry cooler: no evaporation, no water consumed in operation.</text>

  <!-- zones -->
  <rect x="20" y="90" width="430" height="420" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="114" font-weight="bold" fill="#334155">INSIDE: equipment (secondary) loop</text>
  <rect x="470" y="90" width="230" height="420" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="486" y="114" font-weight="bold" fill="#0369a1">CDU</text>
  <rect x="720" y="90" width="360" height="420" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="736" y="114" font-weight="bold" fill="#166534">OUTDOORS: facility loop</text>

  <!-- rack -->
  <rect x="60" y="150" width="150" height="300" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="76" y="176" font-weight="bold">42U rack</text>
  <text x="76" y="198" font-size="12">8 servers</text>
  <text x="76" y="214" font-size="12">16 microchannel GPUs</text>
  <text x="76" y="230" font-size="12">8 cold-plate CPUs</text>
  <text x="76" y="252" font-size="12">6.4 kW to liquid</text>
  <text x="76" y="274" font-size="12">(1.6 kW air group</text>
  <text x="76" y="290" font-size="12"> rejected to room air)</text>
  <!-- equipment loop pipes -->
  <path d="M520,200 L320,200 L320,180 L210,180" stroke="#1d4ed8" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <path d="M210,420 L320,420 L320,400 L520,400" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#o)"/>
  <text x="330" y="222" font-size="12" fill="#1d4ed8">supply 35 °C (controlled)</text>
  <text x="230" y="446" font-size="12" fill="#c2410c">return ≈ 42.7 °C</text>
  <circle cx="400" cy="400" r="18" fill="#fff" stroke="#374151" stroke-width="2"/><text x="392" y="405" font-size="12">P</text>
  <text x="352" y="380" font-size="11">rack pump</text>
  <rect x="245" y="380" width="44" height="40" rx="4" fill="#fef9c3" stroke="#a16207"/><text x="250" y="404" font-size="11">filter</text>
  <rect x="250" y="216" width="40" height="40" rx="4" fill="#e5e7eb" stroke="#6b7280"/><text x="255" y="234" font-size="10">exp.</text><text x="255" y="247" font-size="10">vessel</text>
  <text x="36" y="490" font-size="12" fill="#334155">thermal mass: 6 L supply side, 8 L return side</text>

  <!-- CDU HX -->
  <rect x="520" y="170" width="130" height="260" rx="8" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <g stroke="#93c5fd" stroke-width="2">
    <line x1="540" y1="190" x2="540" y2="410"/><line x1="560" y1="190" x2="560" y2="410"/><line x1="580" y1="190" x2="580" y2="410"/>
    <line x1="600" y1="190" x2="600" y2="410"/><line x1="620" y1="190" x2="620" y2="410"/>
  </g>
  <text x="528" y="300" font-weight="bold" font-size="13">plate HX</text>
  <text x="528" y="318" font-size="11">counterflow</text>
  <text x="528" y="334" font-size="11">ε-NTU</text>
  <text x="482" y="470" font-size="11" fill="#0369a1">UA ≈ 1440 W/K at design;</text>
  <text x="482" y="486" font-size="11" fill="#0369a1">hA falls with coolant viscosity</text>

  <!-- facility loop -->
  <path d="M650,400 L860,400" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#o)"/>
  <path d="M860,200 L650,200" stroke="#1d4ed8" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <text x="670" y="425" font-size="12" fill="#c2410c">facility return ≈ 37.7 °C</text>
  <text x="660" y="186" font-size="12" fill="#1d4ed8">facility supply ≈ 31 °C</text>
  <circle cx="810" cy="200" r="18" fill="#fff" stroke="#374151" stroke-width="2"/><text x="802" y="205" font-size="12">P</text>
  <text x="700" y="236" font-size="11">facility pump 14 L/min</text>
  <!-- dry cooler -->
  <rect x="860" y="330" width="180" height="120" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="872" y="354" font-weight="bold" font-size="13">Dry cooler</text>
  <text x="872" y="372" font-size="11">finned coil, crossflow ε-NTU</text>
  <text x="872" y="388" font-size="11">variable-speed fans (P ∝ s³)</text>
  <text x="872" y="404" font-size="11">PI holds the 35 °C supply</text>
  <text x="872" y="420" font-size="11">UA 2000 W/K, 2 m³/s, 450 W</text>
  <circle cx="910" cy="318" r="14" fill="#e5e7eb" stroke="#374151"/><circle cx="990" cy="318" r="14" fill="#e5e7eb" stroke="#374151"/>
  <text x="1012" y="314" font-size="11" fill="#166534">↑ air</text>
  <!-- bypass -->
  <path d="M845,400 L845,260" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <text x="732" y="290" font-size="11" fill="#4b5563">bypass when air ≥ water or</text>
  <text x="732" y="304" font-size="11" fill="#4b5563">fans cost more than they save</text>
  <!-- chiller -->
  <rect x="860" y="170" width="180" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="872" y="194" font-weight="bold" font-size="13">Trim chiller (optional)</text>
  <text x="872" y="212" font-size="11">only when fans at 100 % can't</text>
  <text x="872" y="228" font-size="11">hold the setpoint; COP = f·Carnot</text>
  <path d="M950,330 L950,240" stroke="#1d4ed8" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <text x="736" y="490" font-size="12" fill="#166534">thermal mass: 25 L; outdoor air: constant or daily sine</text>

  <g transform="translate(30,545)" font-size="13" fill="#111827">
    <text x="0" y="0" font-weight="bold">Energy reported:</text>
    <text x="130" y="0">rack pump + facility pump + dry-cooler fans + chiller = cooling electricity; partial PUE = (IT + server fans + cooling) / (IT + server fans).</text>
    <text x="0" y="22" font-weight="bold">Water reported:</text>
    <text x="130" y="22">0 L/h evaporated in operation, alongside what an evaporative tower would use for the same heat (≈ 9.5 L/h at 6.4 kW).</text>
    <text x="0" y="44" font-weight="bold">Not included:</text>
    <text x="130" y="44">glycol in the facility loop (needs mixture data), the 1.6 kW air-cooled load's room HVAC, humidity, part-load fan + chiller optimisation.</text>
  </g>
</svg>
